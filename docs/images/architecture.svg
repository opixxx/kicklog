<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
      .ios { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; }
      .edge { fill: #fff7ed; stroke: #f97316; stroke-width: 1.5; }
      .app { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.5; }
      .db { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 1.5; }
      .ext { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; stroke-dasharray: 5 3; }
      .title { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 12px; fill: #475569; }
      .label { font-size: 12px; fill: #334155; }
      .group { font-size: 13px; font-weight: 700; fill: #166534; }
      .line { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #94a3b8; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="960" height="560" fill="#ffffff"/>

  <!-- 1행: 데이터 수집 (클라이언트) -->
  <rect class="box" x="40" y="40" width="170" height="70" rx="10"/>
  <text class="title" x="125" y="70" text-anchor="middle">Apple Watch</text>
  <text class="sub" x="125" y="92" text-anchor="middle">Soccer 워크아웃 기록</text>

  <rect class="box" x="270" y="40" width="170" height="70" rx="10"/>
  <text class="title" x="355" y="70" text-anchor="middle">HealthKit</text>
  <text class="sub" x="355" y="92" text-anchor="middle">심박 · 거리 · 속도 원시 데이터</text>

  <rect class="ios" x="500" y="30" width="230" height="90" rx="10"/>
  <text class="title" x="615" y="60" text-anchor="middle">iOS 앱</text>
  <text class="sub" x="615" y="82" text-anchor="middle">SwiftUI · SwiftData · Swift Charts</text>
  <text class="sub" x="615" y="102" text-anchor="middle">경기 자동 그룹핑 · 라벨링 · 분석</text>

  <path class="line" d="M210,75 L266,75"/>
  <path class="line" d="M440,75 L496,75"/>

  <!-- Cloudflare -->
  <rect class="edge" x="530" y="170" width="170" height="60" rx="10"/>
  <text class="title" x="615" y="197" text-anchor="middle">Cloudflare</text>
  <text class="sub" x="615" y="217" text-anchor="middle">TLS Full(strict) · 엣지</text>
  <path class="line" d="M615,120 L615,166"/>
  <text class="label" x="625" y="148">HTTPS · JWT</text>

  <!-- EC2 단일 박스 -->
  <rect x="40" y="270" width="880" height="160" rx="14" fill="#fafffb" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text class="group" x="900" y="296" text-anchor="end">AWS EC2 t4g.small (arm64) · 단일 박스 · Docker Compose · 서울 리전</text>

  <rect class="box" x="90" y="320" width="170" height="80" rx="10"/>
  <text class="title" x="175" y="355" text-anchor="middle">nginx</text>
  <text class="sub" x="175" y="377" text-anchor="middle">리버스 프록시 · keepalive</text>

  <rect class="app" x="370" y="310" width="230" height="100" rx="10"/>
  <text class="title" x="485" y="342" text-anchor="middle">Spring Boot 4 · Kotlin</text>
  <text class="sub" x="485" y="364" text-anchor="middle">auth · match · friend · stat · venue</text>
  <text class="sub" x="485" y="384" text-anchor="middle">Spring Security(JWT) · JPA · Flyway</text>

  <rect class="db" x="700" y="320" width="180" height="80" rx="10"/>
  <text class="title" x="790" y="355" text-anchor="middle">PostgreSQL 16</text>
  <text class="sub" x="790" y="377" text-anchor="middle">전용 EBS 볼륨 · 스냅샷 백업</text>

  <path class="line" d="M615,230 L615,250 L175,250 L175,316"/>
  <path class="line" d="M260,360 L366,360"/>
  <path class="line" d="M600,360 L696,360"/>

  <!-- 외부 연동 -->
  <rect class="ext" x="250" y="470" width="150" height="56" rx="10"/>
  <text class="title" x="325" y="494" text-anchor="middle">Apple · Kakao</text>
  <text class="sub" x="325" y="513" text-anchor="middle">OAuth 로그인</text>

  <rect class="ext" x="420" y="470" width="150" height="56" rx="10"/>
  <text class="title" x="495" y="494" text-anchor="middle">Kakao 로컬</text>
  <text class="sub" x="495" y="513" text-anchor="middle">운동장 장소 검색</text>

  <rect class="ext" x="590" y="470" width="150" height="56" rx="10"/>
  <text class="title" x="665" y="494" text-anchor="middle">Sentry</text>
  <text class="sub" x="665" y="513" text-anchor="middle">에러 추적</text>

  <path class="dash" d="M440,410 L340,466"/>
  <path class="dash" d="M490,410 L493,466"/>
  <path class="dash" d="M540,410 L650,466"/>

  <!-- 배포 경로 -->
  <rect class="ext" x="40" y="140" width="400" height="90" rx="10"/>
  <text class="title" x="60" y="166">배포 (CD)</text>
  <text class="sub" x="60" y="190">GitHub Actions → GHCR 이미지 (git SHA 태그)</text>
  <text class="sub" x="60" y="210">→ OIDC + SSM Run Command → EC2 · 헬스 실패 시 자동 롤백</text>
  <path class="dash" d="M120,230 L120,266"/>
</svg>
