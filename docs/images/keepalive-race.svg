<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e3a8a"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <style>
      .h { font-size: 14px; font-weight: 700; fill: #1e3a8a; }
      .hg { font-size: 14px; font-weight: 700; fill: #166534; }
      .s { font-size: 11.5px; fill: #64748b; }
      .in { font-size: 12px; fill: #334155; }
      .red { font-size: 12px; font-weight: 700; fill: #dc2626; }
      .blue { font-size: 12px; fill: #1e3a8a; }
    </style>
  </defs>
  <rect width="960" height="250" fill="#ffffff"/>

  <text class="h" x="30" y="50">nginx</text>
  <text class="s" x="30" y="68">idle timeout 60s</text>
  <rect x="190" y="34" width="740" height="34" rx="6" fill="#eef2ff" stroke="#1e3a8a" stroke-width="1.4"/>
  <text class="in" x="204" y="56">커넥션이 아직 살아있다고 믿음</text>
  <text class="blue" x="918" y="56" text-anchor="end">60s</text>

  <text class="hg" x="30" y="150">backend</text>
  <text class="s" x="30" y="168">idle timeout 20s</text>
  <rect x="190" y="134" width="200" height="34" rx="6" fill="#ecfdf5" stroke="#15803d" stroke-width="1.4"/>
  <text class="in" x="204" y="156">정상</text>
  <rect x="390" y="134" width="410" height="34" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text class="in" x="404" y="156" fill="#64748b">이미 닫힌 커넥션 — nginx 만 모름</text>

  <line x1="390" y1="20" x2="390" y2="200" stroke="#dc2626" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M380,141 L400,161 M400,141 L380,161" stroke="#dc2626" stroke-width="2.6"/>
  <text class="red" x="390" y="124" text-anchor="middle">FIN · 20s 에 먼저 끊음</text>

  <line x1="600" y1="20" x2="600" y2="200" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M600,68 L600,130" stroke="#1e3a8a" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <text class="blue" x="592" y="96" text-anchor="end">죽은 커넥션 재사용</text>

  <path d="M606,128 L708,96" stroke="#dc2626" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <text class="red" x="650" y="128">RST</text>
  <rect x="712" y="80" width="64" height="30" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="744" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">502</text>

  <path d="M190,214 L930,214" stroke="#94a3b8" stroke-width="1.3" fill="none" marker-end="url(#ax)"/>
  <text class="s" x="390" y="234" text-anchor="middle">20s</text>
  <text class="s" x="600" y="234" text-anchor="middle">idle 재사용 시점</text>
  <text class="s" x="928" y="234" text-anchor="end">시간</text>
</svg>
