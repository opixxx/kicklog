# KickLog Codex 프로젝트 설정
#
# Codex가 이 파일을 로드하려면 사용자가 ~/.codex/config.toml에서
# 이 디렉토리를 trusted project로 등록해야 한다 (.codex/README.md 참조).
#
# 본 설정은 Claude Code의 .claude/settings.json과 평행 구조이며,
# tools/hooks/*.sh 스크립트를 같이 재사용한다 — 단일 진실 원천(SoT).

# ─── Hooks ──────────────────────────────────────────────────────────────────
# Claude Code의 .claude/settings.json hook 배선과 동일한 정책.
# 같은 스크립트(tools/hooks/*.sh)를 호출하므로 동작이 일관된다.

# 위험 Bash 명령 차단 (rm -rf /, git push --force, DROP TABLE 등)
[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "bash"
args = ["-c", "exec \"$(git rev-parse --show-toplevel 2>/dev/null || pwd)/tools/hooks/guard-bash.sh\""]
timeout = 30
statusMessage = "위험 명령 검사 중"

# 세션 시작 시 현재 작업 상태 자동 컨텍스트 주입
# (worktree·브랜치·활성 EXEC_PLAN·최근 커밋·미커밋 변경 요약)
[[hooks.SessionStart]]

[[hooks.SessionStart.hooks]]
type = "command"
command = "bash"
args = ["-c", "exec \"$(git rev-parse --show-toplevel 2>/dev/null || pwd)/tools/hooks/session-context.sh\""]
timeout = 30

# main 브랜치 메인 디렉토리에서 백엔드 소스 직접 수정 차단 (iOS 는 보호 대상 아님)
[[hooks.PreToolUse]]
matcher = "^(Edit|Write|NotebookEdit)$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "bash"
args = ["-c", "exec \"$(git rev-parse --show-toplevel 2>/dev/null || pwd)/tools/hooks/enforce-worktree.sh\""]
timeout = 30
statusMessage = "worktree 정책 검사 중"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "bash"
args = ["-c", "exec \"$(git rev-parse --show-toplevel 2>/dev/null || pwd)/tools/hooks/enforce-plan.sh\""]
timeout = 30
statusMessage = "EXEC_PLAN 정책 검사 중"

# 작업 종료 시 백엔드 compile + 자가수정 루프 (최대 3회)
[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = "bash"
args = ["-c", "exec \"$(git rev-parse --show-toplevel 2>/dev/null || pwd)/tools/hooks/verify-and-block.sh\""]
timeout = 300
statusMessage = "백엔드 컴파일 검증 중"

# ─── Skills ─────────────────────────────────────────────────────────────────
# Claude Code 원본 skill을 .codex/skills/**/SKILL.md 로 복제해 Codex가 직접 로드할 수 있게 등록한다.
# 원본 갱신 시 .claude/skills/** 와 .codex/skills/** 를 함께 동기화한다.

[[skills.config]]
path = "skills/orchestrator"
enabled = true

[[skills.config]]
path = "skills/pr-guide"
enabled = true

[[skills.config]]
path = "skills/code-review"
enabled = true

[[skills.config]]
path = "skills/coding-conventions"
enabled = true

# ─── Agents ─────────────────────────────────────────────────────────────────
# Claude Code 원본 agent markdown을 .codex/agents/*.md 로 복제하고,
# Codex custom agent role은 .codex/agents/*.toml 을 통해 해당 지침을 읽는다.

[agents]
max_threads = 6
max_depth = 1

[agents.code-reviewer]
description = "KickLog 백엔드(Kotlin/Spring Boot 4) 코드 리뷰 전용. backend/만 검토하고 coding-conventions를 따른다."
config_file = "agents/code-reviewer.toml"
nickname_candidates = ["Backend Reviewer", "Kotlin Reviewer"]

[agents.backend-test-writer]
description = "KickLog 백엔드 테스트 작성 전용. Cucumber-JVM 인수 시나리오 + JUnit 5 + Testcontainers 기반으로 RED 테스트를 작성한다."
config_file = "agents/backend-test-writer.toml"
nickname_candidates = ["Backend Test Writer", "Spring Test Writer"]

# ─── 모델 / 승인 정책 (선택) ─────────────────────────────────────────────────
# 글로벌 ~/.codex/config.toml에서 일반적 기본값을 두고, 여기는 프로젝트 특이값만.
# 현재는 글로벌 기본값에 위임.
