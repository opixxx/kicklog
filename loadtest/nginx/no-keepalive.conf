# S0 — upstream keepalive 없음 (현 운영 nginx-kicklog.conf 모사)
#
# proxy_http_version 미지정(기본 1.0) + Connection: close → nginx ↔ backend 매 요청 신규 커넥션.
# → loopback TIME_WAIT 누적 (①막). race 는 발생하지 않음 (idle keep-alive 커넥션 자체가 없음).
worker_processes 1;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
}

http {
    access_log off;

    upstream app {
        server backend:8080;
        # keepalive 디렉티브 없음 — 풀 미유지 = 매 요청 새 커넥션
    }

    server {
        listen 80;

        location / {
            proxy_pass http://app;
            # proxy_http_version / Connection 미지정 → HTTP/1.0 + Connection: close
        }
    }
}
