# S1/S2 — upstream keepalive 켬 (nginx ↔ backend 영속 커넥션 풀)
#
# 세 디렉티브가 모두 있어야 keep-alive:
#   keepalive 32 (풀) + proxy_http_version 1.1 + proxy_set_header Connection ""
# keepalive_timeout 60s = proxy idle timeout (= race 의 "긴 쪽").
#
# 이 conf + backend TOMCAT_KEEPALIVE_TIMEOUT 조합으로 막을 가른다:
#   S1: backend 1s  < nginx 60s  → 비대칭 → 502 race
#   S2: backend 80s > nginx 60s  → 비대칭 해소 → race 0
worker_processes 1;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
}

http {
    access_log off;

    upstream app {
        server backend:8080;
        keepalive 32;             # upstream 풀 유지
        keepalive_timeout 60s;    # proxy idle timeout (긴 쪽)
        keepalive_requests 10000; # 요청 수 기반 회수는 크게 (timeout race 만 관찰)
    }

    server {
        listen 80;

        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;          # Keep-Alive (1.0 불가)
            proxy_set_header Connection "";  # upstream Keep-Alive 보존
            # race 를 가리지 않도록 retry 비활성 (기본 proxy_next_upstream 마스킹 방지)
            proxy_next_upstream off;
        }
    }
}
