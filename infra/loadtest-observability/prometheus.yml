# 부하테스트 관측용 Prometheus — 로컬 전용이다.
#
# 두 갈래의 지표를 한 저장소로 모은다:
#   ① 백엔드(스크레이프)  — Tomcat 스레드·JVM 스레드·HikariCP·CPU. "서버 안에서 무슨 일이 일어나는지"
#   ② k6(remote write)    — 주입률·처리량·drop·응답시간 분포. "밖에서 본 결과"
#
# 둘이 같은 타임라인에 있어야 "처리량이 꺾인 순간 스레드가 꽉 찼다"를 **한 화면에서** 볼 수 있다.
# 따로 보면 인과를 눈으로 확인할 수 없다.

global:
  # 부하 구간이 25초짜리라 기본 15s 로는 평탄화 순간을 놓친다. 2s 로 촘촘히 본다.
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: kicklog-backend
    metrics_path: /actuator/prometheus
    static_configs:
      # 백엔드는 호스트에서 네이티브로 돌린다(측정 대상을 컨테이너에 넣으면
      # cgroup CPU 제한·네트워크 NAT 가 측정에 섞인다). 컨테이너에서 호스트로 나가는 이름.
      #
      # **8081 은 관리 포트다** (application-loadtest.yml 의 management.server.port).
      # 부하를 받는 8080 을 긁으면 스레드가 포화한 순간 스크레이프가 같은 풀에서 대기하다
      # 타임아웃되어, 가장 중요한 구간의 지표가 통째로 비어버린다.
      - targets: ['host.docker.internal:8081']
        labels:
          instance: backend
