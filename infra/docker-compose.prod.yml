# =============================================
# KickLog Backend — EC2 운영 컴포즈
# =============================================
# 사용처: /opt/kicklog/docker-compose.yml 로 복사 (또는 심볼릭 링크)
# 사전 조건:
#   /opt/kicklog/.env           ← Secrets Manager → fetch-secrets.sh 가 생성
#   /opt/kicklog/.env.deploy    ← KICKLOG_IMAGE_TAG=<git-sha> (배포 시 cd.yml 이 작성)
#
# 실행 (CD 가 사용하는 정확한 명령):
#   cd /opt/kicklog
#   docker compose --env-file .env --env-file .env.deploy pull
#   docker compose --env-file .env --env-file .env.deploy up -d
#
# 로그:
#   docker compose logs -f backend
#
# 헬스 체크:
#   curl http://127.0.0.1:8080/actuator/health
#
# nginx (호스트 OS) 가 127.0.0.1:8080 → 80/443 으로 reverse proxy.
# 즉 backend 컨테이너는 외부 노출 X (localhost bind).
#
# ADR-0009: image tag 는 git SHA 로 immutable. `latest` 의존 제거.
#           KICKLOG_IMAGE_TAG 가 비어 있으면 compose 가 즉시 abort 한다.

services:
  backend:
    image: "ghcr.io/opixxx/kicklog:${KICKLOG_IMAGE_TAG:?KICKLOG_IMAGE_TAG 환경변수가 비어 있습니다 — .env.deploy 누락}"
    container_name: kicklog-backend
    restart: unless-stopped

    # localhost 만 bind — nginx 만 접근. 0.0.0.0 노출 X (SG 로 한 번 더 보호하지만 이중 안전).
    ports:
      - "127.0.0.1:8080:8080"

    # /opt/kicklog/.env 에서 환경변수 로드 (Secrets Manager → fetch-secrets.sh 가 생성)
    env_file:
      - .env

    # Spring Boot prod profile + nginx 헤더 신뢰
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_FORWARDHEADERSSTRATEGY: NATIVE

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

    # 로그 회전 — t3.micro 디스크 30GB 보호
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
