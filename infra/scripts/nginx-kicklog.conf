# =============================================
# nginx — KickLog Reverse Proxy (HTTPS)
# =============================================
# 위치: /etc/nginx/conf.d/kicklog.conf (user-data.sh 가 만든 기본 파일을 덮어씀)
#
# 사용 흐름:
#   1. EC2 SSH 후 이 파일을 /etc/nginx/conf.d/kicklog.conf 로 복사
#   2. sudo certbot --nginx -d kicklog.org
#      → certbot 이 ssl_certificate / ssl_certificate_key 두 줄을 자동 추가
#      → HTTP → HTTPS 자동 redirect 도 자동 설정
#   3. sudo nginx -t && sudo systemctl reload nginx
#
# 갱신 자동:
#   certbot.timer 가 systemd 로 매일 2회 자동 갱신 시도. cron 작업 별도 불필요.

# ─── rate limit zone (DDoS / brute force 완화) ─────────
# 인증 엔드포인트는 IP 당 10 req/s
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
# 일반 API 는 IP 당 50 req/s
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

# ─── HTTP server (certbot 이 HTTPS 로 redirect 자동 추가) ─
server {
    listen 80;
    server_name kicklog.org www.kicklog.org;

    # ACME challenge (Let's Encrypt 갱신용)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # certbot --nginx 실행 후 아래 두 줄을 자동 삽입:
    # if ($host = kicklog.org) {
    #     return 301 https://$host$request_uri;
    # }
}

# ─── HTTPS server ──────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name kicklog.org www.kicklog.org;

    # certbot --nginx 가 아래 두 줄을 자동 삽입:
    # ssl_certificate     /etc/letsencrypt/live/kicklog.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/kicklog.org/privkey.pem;

    # TLS 보안 (Mozilla intermediate 기준)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS — .org 는 preload 자동이 아니라서 명시. max-age 6 개월.
    # ⚠️ 도메인 안정화 후 includeSubDomains + preload 추가 검토
    add_header Strict-Transport-Security "max-age=15768000" always;

    # 기본 보안 헤더
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # gzip 압축 (텍스트 응답 트래픽 절감)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain application/json application/javascript text/css application/xml;

    client_max_body_size 10M;

    # ─── Universal Link (Apple App Site Association) ───
    # AASA 파일은 정적 호스팅. /var/www/kicklog/.well-known/apple-app-site-association
    location = /.well-known/apple-app-site-association {
        root /var/www/kicklog;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    # ─── 인증 엔드포인트 (조금 더 엄격한 rate limit) ──
    location ~ ^/(auth|users)/ {
        limit_req zone=auth_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ─── 일반 API ──────────────────────────────────────
    location / {
        limit_req zone=api_limit burst=100 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 헬스체크는 nginx 자체 응답 (백엔드 다운 시에도 nginx 살아있는지 확인용)
    location = /nginx-health {
        access_log off;
        return 200 "nginx ok\n";
        add_header Content-Type text/plain;
    }
}
