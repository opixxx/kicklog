# =============================================
# nginx — KickLog Reverse Proxy (운영 SoT)
# =============================================
# 배치 위치: /etc/nginx/conf.d/kicklog.conf
# 배치 방법: 직접 수정하지 않는다. `apply-host-config.sh` 가 S3 staging 에서
#            받아 배치하고 `nginx -t` 통과 시에만 reload 한다 (CD 가 호출).
#
# ⚠️ 2026-10-10 이전까지 이 파일은 운영과 달랐다 (ADR-0015).
#    운영에만 있던 것: AASA location · /nginx-health · client_max_body_size · read timeout
#    저장소에만 있던 것: rate limit (즉 운영에 rate limit 이 없었다)
#    박스에 직접 손대면 같은 일이 반복된다 — 변경은 반드시 이 파일에서 한다.
#
# TLS: Cloudflare Origin CA 인증서 (유효기간 15년, install-origin-cert.sh 가 설치).
#      Let's Encrypt/certbot 은 더 이상 쓰지 않는다 — 프록시(Cloudflare) 뒤에서
#      HTTP-01 갱신이 조용히 죽어 인증서가 46일간 만료 상태로 방치됐다 (ADR-0015 D1).
#
# 실제 클라이언트 IP: 00-cloudflare-realip.conf 가 set_real_ip_from + CF-Connecting-IP
#      를 설정한다. 그게 없으면 $binary_remote_addr 이 전부 Cloudflare 엣지 IP 라
#      rate limit 이 전 사용자를 한 버킷에 묶고 로그·Sentry 의 IP 도 쓸모없어진다.

# ─── rate limit zone ──────────────────────────────────
# 인증 엔드포인트는 brute force 표적이라 더 좁게 잡는다.
# 10m zone = 약 16만 IP 추적 (IP 당 64바이트).
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

# 초과 시 503(기본) 대신 429 — 클라이언트가 재시도 가능한 상태임을 알 수 있다.
limit_req_status 429;

# ─── 로그 포맷 ────────────────────────────────────────
# cf_ray 를 남겨두면 Cloudflare 대시보드의 요청과 오리진 로그를 대조할 수 있다.
log_format kicklog '$remote_addr - $status $request_time "$request" '
                   'ua="$http_user_agent" cf_ray="$http_cf_ray"';

# ─── HTTP (80) ────────────────────────────────────────
# 평시 SG 가 80 을 차단하므로 외부에서 닿지 않는다 (ADR-0015 D4).
# break-glass 로 80 을 열었을 때를 위해 ACME 경로만 남기고 나머지는 HTTPS 로 보낸다.
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://kicklog.org$request_uri;
    }
}

# ─── HTTPS (443) ──────────────────────────────────────
server {
    listen 443 ssl default_server;
    http2 on; # nginx 1.25.1+ 문법 (listen ... http2 는 deprecated)

    server_name kicklog.org www.kicklog.org;

    access_log /var/log/nginx/access.log kicklog;

    # Cloudflare Origin CA — 엣지만 신뢰하면 되므로 공인 CA 가 필요 없다.
    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 업로드 상한 — 경기 데이터 JSON 기준 충분 (운영에서 쓰던 값 유지).
    client_max_body_size 10M;

    # ─── Universal Link (AASA) ────────────────────────
    # 파일은 apply-host-config.sh 가 /var/www/kicklog/.well-known/ 에 배치한다.
    # iOS 쪽 Associated Domains entitlement 는 별도 작업 (ADR-0007 D4).
    location = /.well-known/apple-app-site-association {
        root /var/www/kicklog;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    # ─── nginx 자체 생존 확인 ─────────────────────────
    # 백엔드를 거치지 않는다 — "nginx 는 살았는데 앱이 죽은" 상태를 구분하기 위함.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "nginx ok\n";
    }

    # ─── 인증 엔드포인트 (좁은 rate limit) ────────────
    location /auth/ {
        limit_req zone=auth_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ─── 일반 API ─────────────────────────────────────
    location / {
        limit_req zone=api_limit burst=100 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        # ⚠️ upstream keepalive 는 의도적으로 넣지 않았다.
        # ADR-0010 이 측정·결정해 둔 항목이지만 성능 변경이라 blast radius 를 분리한다
        # (별도 PR 에서 backend keep-alive-timeout > proxy 비대칭을 함께 맞춘 뒤 적용).
    }
}
