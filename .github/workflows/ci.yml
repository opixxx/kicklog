name: CI

on:
  # main 푸시 시점의 backend check 는 cd.yml 의 test job 이 담당. CI 는 PR 전용으로 분리.
  # 브랜치 전략상 기능 PR 은 develop 베이스 → develop PR 에서도 backend check 게이트가 돌도록 포함.
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  backend-check:
    name: Backend Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kicklog
          POSTGRES_USER: kicklog
          POSTGRES_PASSWORD: kicklog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kicklog -d kicklog"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DB_URL: jdbc:postgresql://localhost:5432/kicklog
      DB_USERNAME: kicklog
      DB_PASSWORD: kicklog
      JWT_SECRET: ci-secret-change-me-minimum-32-chars

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run backend check
        run: ./gradlew check
