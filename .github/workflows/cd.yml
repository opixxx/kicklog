name: CD

# main 브랜치에 push 되면:
#   1. backend test (./gradlew check)
#   2. Docker 이미지 빌드 + GHCR push (linux/amd64) — git SHA tag 만, latest 사용 안 함
#   3. SSM Run Command 로 EC2 에 SHA 기반 배포 + 헬스 체크 + 자동 롤백
#
# ADR-0008 — SSH/scp 의존을 제거하고 SSM Run Command + S3 staging + OIDC 로 배포한다.
# ADR-0009 — `latest` 태그 의존 제거, SHA immutable + 헬스 실패 시 직전 SHA 자동 롤백.
#
# 필요한 GitHub repository Variables (Settings → Variables → Actions):
#   - AWS_GITHUB_ROLE_ARN     : terraform output github_actions_role_arn
#   - DEPLOY_STAGING_BUCKET   : terraform output deploy_staging_bucket_name
#   - EC2_INSTANCE_ID         : terraform output ec2_instance_id
#
# 필요한 Secrets: 없음 (OIDC 로 IAM AssumeRole, GHCR_PAT 은 AWS Secrets Manager 로 이전)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "infra/docker-compose.prod.yml"
      # ADR-0015: 호스트 설정(nginx conf · 스크립트 · systemd unit · AASA)도
      # 배포 산출물이다. 박스에 직접 손대지 않기 위해 변경 시 CD 를 태운다.
      - "infra/scripts/**"
      - "infra/systemd/**"
      - "infra/web/**"
      - ".github/workflows/cd.yml"
  workflow_dispatch:

# 최소 권한 원칙 — packages:write 는 build-and-push job 에만 부여 (SonarQube 권고).
permissions:
  contents: read

# 동일 브랜치 동시 배포 방지 (이전 배포 끝날 때까지 대기)
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Backend Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kicklog
          POSTGRES_USER: kicklog
          POSTGRES_PASSWORD: kicklog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kicklog -d kicklog"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DB_URL: jdbc:postgresql://localhost:5432/kicklog
      DB_USERNAME: kicklog
      DB_PASSWORD: kicklog
      JWT_SECRET: ci-secret-change-me-minimum-32-chars

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Gradle check
        run: ./gradlew check

  build-and-push:
    name: Build and Push Image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # arm64 런타임 스테이지(addgroup·chown 등 소수 명령)를 amd64 러너에서 실행하기 위한
      # binfmt 등록. Gradle 빌드는 Dockerfile 의 --platform=$BUILDPLATFORM 덕분에
      # 네이티브로 돌아 에뮬레이션 비용이 거의 없다 (ADR-0016).
      - name: Set up QEMU (arm64 binfmt)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ADR-0009: SHA tag 한 개만 push. `latest` 사용 안 함 → 어떤 빌드가 prod 인지 항상 명확.
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          # ADR-0016: EC2 가 Graviton(arm64) 이라 arm64 이미지를 빌드한다.
          # Dockerfile 의 빌더 스테이지가 --platform=$BUILDPLATFORM 이라 Gradle 은
          # 러너 네이티브(amd64)로 돌고, 런타임 스테이지만 arm64 로 조립된다.
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kicklog:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2 (via SSM)
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ADR-0008: OIDC 로 AWS IAM Role AssumeRole — id-token write 필수
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-northeast-2
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      DEPLOY_STAGING_BUCKET: ${{ vars.DEPLOY_STAGING_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload deploy artifacts to S3 staging
        run: |
          aws s3 cp infra/docker-compose.prod.yml \
            "s3://${DEPLOY_STAGING_BUCKET}/docker-compose.prod.yml" \
            --no-progress
          # fetch-secrets.sh 도 함께 배포 — EC2 의 스크립트를 항상 최신(코드 SoT)으로 유지.
          aws s3 cp infra/scripts/fetch-secrets.sh \
            "s3://${DEPLOY_STAGING_BUCKET}/fetch-secrets.sh" \
            --no-progress

          # ADR-0015 — 호스트 설정 산출물을 host/ prefix 로 올린다.
          # apply-host-config.sh 가 이 묶음을 받아 nginx conf · TLS 인증서 · AASA ·
          # systemd timer 를 멱등하게 배치한다 (박스 직접 수정 금지).
          aws s3 cp infra/scripts/ "s3://${DEPLOY_STAGING_BUCKET}/host/" \
            --recursive --exclude "*" --include "*.sh" --no-progress
          aws s3 cp infra/scripts/nginx-kicklog.conf \
            "s3://${DEPLOY_STAGING_BUCKET}/host/nginx-kicklog.conf" --no-progress
          aws s3 cp infra/systemd/ "s3://${DEPLOY_STAGING_BUCKET}/host/" \
            --recursive --no-progress
          aws s3 cp infra/web/.well-known/apple-app-site-association \
            "s3://${DEPLOY_STAGING_BUCKET}/host/apple-app-site-association" --no-progress

      # ADR-0009: SSM 스크립트가 SHA tag 를 .env.deploy 에 기록하고,
      # 헬스 체크 실패 시 직전 SHA 로 자동 롤백한다.
      - name: Send SSM Run Command — SHA pull + restart + auto-rollback
        id: ssm
        env:
          GITHUB_SHA: ${{ github.sha }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # EC2 에서 실행할 배포 스크립트. heredoc → jq 로 JSON 배열에 안전하게 임베드.
          SCRIPT=$(cat <<EOF
          set -euo pipefail
          cd /opt/kicklog

          DEPLOY_DIR=/opt/kicklog/.deploy
          mkdir -p "\$DEPLOY_DIR"
          chown ec2-user:ec2-user "\$DEPLOY_DIR"

          # ── 직전 SHA 백업 (없으면 빈 문자열) ──
          PREVIOUS_TAG=""
          if [ -f "\$DEPLOY_DIR/current-tag" ]; then
            PREVIOUS_TAG=\$(cat "\$DEPLOY_DIR/current-tag")
            echo "\$PREVIOUS_TAG" > "\$DEPLOY_DIR/previous-tag"
          fi
          echo "직전 SHA: \${PREVIOUS_TAG:-<없음>}"

          # ── 새 compose 파일 가져오기 (S3 staging) ──
          aws s3 cp s3://${DEPLOY_STAGING_BUCKET}/docker-compose.prod.yml ./docker-compose.yml --no-progress

          # ── fetch-secrets.sh 최신본으로 .env 재생성 (Secrets Manager → .env) ──
          # .env 를 항상 코드(secret) 기준으로 동기화 — SENTRY_DSN 등 신규 키도 자동 반영.
          # secret 조회 실패 시 fetch-secrets.sh 가 set -e 로 중단 → 배포 실패(의도).
          aws s3 cp s3://${DEPLOY_STAGING_BUCKET}/fetch-secrets.sh ./fetch-secrets.sh --no-progress
          AWS_REGION=${AWS_REGION} bash ./fetch-secrets.sh

          # ── .env.deploy 갱신 (KICKLOG_IMAGE_TAG=<full SHA>) ──
          NEW_TAG="${GITHUB_SHA}"
          umask 077
          cat > .env.deploy <<ENVEOF
          # Auto-generated by GitHub Actions CD (ADR-0009)
          # 변경 금지 — 다음 배포 시 자동 갱신됨.
          KICKLOG_IMAGE_TAG=\${NEW_TAG}
          ENVEOF
          chown ec2-user:ec2-user .env.deploy
          echo "\$NEW_TAG" > "\$DEPLOY_DIR/current-tag"

          # ── GHCR 인증 ──
          GHCR_PAT=\$(aws secretsmanager get-secret-value \
            --region ${AWS_REGION} \
            --secret-id kicklog/ghcr-pat \
            --query SecretString --output text)
          echo "\$GHCR_PAT" | docker login ghcr.io -u ${REPO_OWNER} --password-stdin
          unset GHCR_PAT

          # ── 새 이미지 pull + up ──
          # KICKLOG_IMAGE_TAG 미설정이면 compose 가 즉시 abort (ADR-0009).
          compose_cmd="docker compose --env-file .env --env-file .env.deploy"
          \$compose_cmd pull
          \$compose_cmd up -d

          # ── 헬스 체크 (최대 60초 대기) ──
          healthy=false
          for i in 1 2 3 4 5 6; do
            sleep 10
            if curl -fsS http://127.0.0.1:8080/actuator/health > /dev/null 2>&1; then
              echo "헬스 체크 통과 (\${i}0초 후, tag=\${NEW_TAG:0:7})"
              healthy=true
              break
            fi
          done

          if [ "\$healthy" = "false" ]; then
            echo "헬스 체크 실패 — 최근 로그:"
            \$compose_cmd logs --tail 100 backend || true

            if [ -n "\$PREVIOUS_TAG" ]; then
              echo "직전 SHA 로 자동 롤백 시도: \${PREVIOUS_TAG:0:7}"
              cat > .env.deploy <<ENVEOF
          KICKLOG_IMAGE_TAG=\${PREVIOUS_TAG}
          ENVEOF
              \$compose_cmd pull || true
              \$compose_cmd up -d

              # 롤백 후 헬스 체크 (최대 60초)
              rolled_back=false
              for i in 1 2 3 4 5 6; do
                sleep 10
                if curl -fsS http://127.0.0.1:8080/actuator/health > /dev/null 2>&1; then
                  echo "롤백 헬스 체크 통과 (\${i}0초 후)"
                  rolled_back=true
                  echo "\$PREVIOUS_TAG" > "\$DEPLOY_DIR/current-tag"
                  break
                fi
              done

              if [ "\$rolled_back" = "false" ]; then
                echo "롤백 후에도 헬스 체크 실패 — 수동 개입 필요 (SSM Session Manager)"
                exit 1
              fi
              # 롤백은 성공했지만 배포 자체는 실패 → 워크플로 fail
              echo "롤백 성공. 그러나 배포는 실패로 보고합니다 (\${NEW_TAG:0:7} → \${PREVIOUS_TAG:0:7})."
              exit 1
            else
              echo "직전 SHA 가 없어 롤백 불가 — 수동 개입 필요"
              exit 1
            fi
          fi

          # ── 오래된 dangling 이미지 정리 (디스크 보호, 단 롤백 후보는 7일 보존) ──
          docker image prune -af --filter "until=168h" || true

          # ── 호스트 설정 적용 (ADR-0015) ──
          # 앱 헬스 체크를 통과한 뒤에 수행한다 — nginx conf 가 깨져도 롤백 로직이
          # 이미 끝난 상태라 서로 간섭하지 않는다. apply-host-config.sh 자체가
          # nginx -t 게이트 + 직전 conf 자동 롤백을 갖고 있다.
          aws s3 cp s3://${DEPLOY_STAGING_BUCKET}/host/apply-host-config.sh \
            ./apply-host-config.sh --no-progress
          DEPLOY_STAGING_BUCKET=${DEPLOY_STAGING_BUCKET} AWS_REGION=${AWS_REGION} \
            bash ./apply-host-config.sh

          echo "Deploy 성공: \$(date) tag=\${NEW_TAG:0:7}"
          EOF
          )

          PARAMS=$(jq -n --arg s "$SCRIPT" '{ commands: [$s] }')

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${GITHUB_SHA:0:7}" \
            --parameters "$PARAMS" \
            --cloud-watch-output-config CloudWatchOutputEnabled=false \
            --query "Command.CommandId" --output text)

          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "SSM CommandId: $CMD_ID"

      - name: Wait for SSM command and fetch result
        env:
          CMD_ID: ${{ steps.ssm.outputs.command_id }}
        run: |
          set -uo pipefail

          # 최대 10분 대기 (wait 자체가 non-zero 여도 get-invocation 으로 최종 상태 판정)
          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" || true

          INV=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --output json)

          STATUS=$(echo "$INV" | jq -r .Status)
          echo "::group::SSM stdout"
          echo "$INV" | jq -r .StandardOutputContent
          echo "::endgroup::"
          echo "::group::SSM stderr"
          echo "$INV" | jq -r .StandardErrorContent
          echo "::endgroup::"

          echo "최종 상태: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            echo "배포 실패 (자동 롤백 시도 여부는 SSM stdout 참조)"
            exit 1
          fi
