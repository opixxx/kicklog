name: CD

# main 브랜치에 push 되면:
#   1. backend test (./gradlew check)
#   2. Docker 이미지 빌드 + GHCR push (linux/amd64)
#   3. EC2 에 SSH → docker compose pull + up + 헬스 체크
#
# 필요한 Secrets:
#   - EC2_HOST              : 3.37.14.253
#   - EC2_SSH_PRIVATE_KEY   : ~/.ssh/kicklog-keypair.pem 내용 (BEGIN/END 전체)
#   - GHCR_PAT              : GitHub PAT (classic, read:packages 권한)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "infra/docker-compose.prod.yml"
      - ".github/workflows/cd.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# 동일 브랜치 동시 배포 방지 (이전 배포 끝날 때까지 대기)
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Backend Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kicklog
          POSTGRES_USER: kicklog
          POSTGRES_PASSWORD: kicklog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kicklog -d kicklog"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DB_URL: jdbc:postgresql://localhost:5432/kicklog
      DB_USERNAME: kicklog
      DB_PASSWORD: kicklog
      JWT_SECRET: ci-secret-change-me-minimum-32-chars

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Gradle check
        run: ./gradlew check

  build-and-push:
    name: Build and Push Image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kicklog:latest
            ghcr.io/${{ github.repository_owner }}/kicklog:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "infra/docker-compose.prod.yml"
          target: "/opt/kicklog/"
          strip_components: 1

      - name: Pull image and restart container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -e
            cd /opt/kicklog

            # 새 compose 파일을 활성 이름으로 복사
            cp docker-compose.prod.yml docker-compose.yml

            # GHCR private 패키지 인증
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            # 새 이미지 받기 + 컨테이너 재시작
            docker compose pull
            docker compose up -d

            # 헬스 체크 (최대 60초 대기)
            for i in 1 2 3 4 5 6; do
              sleep 10
              if curl -fsS http://127.0.0.1:8080/actuator/health > /dev/null 2>&1; then
                echo "✅ 헬스 체크 통과 (${i}0초 후)"
                break
              fi
              if [ $i -eq 6 ]; then
                echo "❌ 헬스 체크 실패 — 로그 확인"
                docker compose logs --tail 50 backend
                exit 1
              fi
            done

            # 오래된 dangling 이미지 정리 (디스크 보호)
            docker image prune -af --filter "until=24h" || true

            echo "✅ Deploy 성공: $(date)"
