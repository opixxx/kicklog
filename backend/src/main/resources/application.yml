spring:
  application:
    name: kicklog

  # 로컬 개발용 .env 파일 로드 (없으면 무시) — OS 환경변수가 우선.
  # 운영 환경(EC2/systemd, SSM)에서는 .env 없이 OS env 만으로 동작한다.
  config:
    import: "optional:file:.env[.properties]"

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kicklog}
    username: ${DB_USERNAME:kicklog}
    password: ${DB_PASSWORD:kicklog}
    driver-class-name: org.postgresql.Driver
    hikari:
      # 커넥션 풀 크기 — 기본 10 유지, 운영 부하테스트 시 환경변수로 조정 (ADR-0011).
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        # 잔여 lazy 컬렉션 N+1 안전망 — IN 절로 batch 로딩.
        default_batch_fetch_size: 100
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  lifecycle:
    # graceful shutdown 의 유예 시간. 이 시간이 지나면 남은 요청도 끊고 종료한다.
    timeout-per-shutdown-phase: ${SHUTDOWN_GRACE_PERIOD:20s}

server:
  port: ${SERVER_PORT:8080}
  # 종료 신호를 받으면 새 요청은 거절하되 처리 중인 요청은 끝까지 흘려보낸다.
  # 없으면 배포(CD)마다 in-flight 요청이 그대로 끊긴다.
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# Sentry 에러 트래킹 — SentryConfig 가 수동 init 에서 읽는다 (코어 의존성, starter 미사용).
# 그 외 옵션(send-default-pii=false, traces-sample-rate=0)은 SentryConfig 에 코드로 고정.
sentry:
  # DSN 이 비어 있으면 init 을 건너뛰어 SDK 가 비활성 — local/test 는 별도 설정 없이 off.
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  # 릴리스별 회귀 추적용 — CD 에서 git SHA 주입 가능(후속). 미설정이면 무시.
  release: ${SENTRY_RELEASE:}

logging:
  level:
    root: INFO
    com.opixxx.kicklog: DEBUG
  pattern:
    # Spring 기본 콘솔 패턴에 traceId(MDC) 만 추가 — 요청별 로그 상관관계 추적.
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%X{traceId}]){faint} %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"

kicklog:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-in-production-min-32-chars}
    issuer: ${JWT_ISSUER:kicklog}
    audience: ${JWT_AUDIENCE:kicklog-ios}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:30}
  apple:
    client-id: ${APPLE_CLIENT_ID:com.opixxx.KickLog}
    jwks-url: ${APPLE_JWKS_URL:https://appleid.apple.com/auth/keys}
    # 서명 키는 로테이션 주기가 길어 매 로그인마다 받아올 이유가 없다.
    # kid 가 캐시에 없으면 TTL 과 무관하게 즉시 재조회하므로 로테이션에 뒤처지지 않는다.
    jwks-cache-ttl-minutes: ${APPLE_JWKS_CACHE_TTL_MINUTES:360}
  kakao:
    user-info-url: ${KAKAO_USER_INFO_URL:https://kapi.kakao.com/v2/user/me}
    rest-api-key: ${KAKAO_REST_API_KEY:}
    local-search-url: ${KAKAO_LOCAL_SEARCH_URL:https://dapi.kakao.com/v2/local/search/keyword.json}

  # 모든 외부 HTTP 클라이언트가 공유하는 타임아웃 (config/RestClientConfig).
  # 원래 kicklog.kakao 아래 있었으나 Apple 인증도 같은 빌더를 쓰게 되어 이름을 일반화했다.
  # **타임아웃이 없으면 외부가 응답하지 않을 때 스레드가 영구 점유되어 전역 장애가 된다** (ADR-0017 D11).
  external-http:
    connect-timeout-millis: ${EXTERNAL_HTTP_CONNECT_TIMEOUT_MILLIS:2000}
    read-timeout-millis: ${EXTERNAL_HTTP_READ_TIMEOUT_MILLIS:3000}
  # 초대 링크 도메인은 P1 V13 에서 폐기 — kicklog.invitation prefix 와 INVITATION_BASE_URL 환경변수 모두 제거.
