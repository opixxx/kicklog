spring:
  datasource:
    url: jdbc:h2:mem:kicklog;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE DOMAIN IF NOT EXISTS TIMESTAMPTZ AS TIMESTAMP WITH TIME ZONE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

kicklog:
  jwt:
    secret: test-secret-change-me-minimum-32-chars
    issuer: kicklog
    audience: kicklog-ios
    access-token-minutes: 15
    refresh-token-days: 30
  apple:
    client-id: com.opixxx.kicklog
    jwks-url: http://localhost/apple/keys
  kakao:
    user-info-url: http://localhost/kakao/user
    rest-api-key: test-rest-key
    local-search-url: https://dapi.kakao.com/v2/local/search/keyword.json
