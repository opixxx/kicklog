spring:
  datasource:
    url: jdbc:h2:mem:kicklog;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE DOMAIN IF NOT EXISTS TIMESTAMPTZ AS TIMESTAMP WITH TIME ZONE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

kicklog:
  jwt:
    secret: test-secret-change-me-minimum-32-chars
    access-expiration-hours: 1
    refresh-expiration-days: 90
